        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#AFA9EC", "font": {"color": "white"}, "id": "Steve Jobs", "label": "Steve Jobs", "shape": "ellipse", "size": 30, "title": "\u003cb\u003ePerson\u003c/b\u003e\u003cbr\u003eSteve Jobs"}, {"color": "#5DCAA5", "font": {"color": "white"}, "id": "Apple Inc.", "label": "Apple Inc.", "shape": "box", "size": 30, "title": "\u003cb\u003eOrganization\u003c/b\u003e\u003cbr\u003eApple Inc."}, {"color": "#F0997B", "font": {"color": "white"}, "id": "California", "label": "California", "shape": "diamond", "size": 30, "title": "\u003cb\u003eLocation\u003c/b\u003e\u003cbr\u003eCalifornia"}, {"color": "#EF9F27", "font": {"color": "white"}, "id": "1955", "label": "1955", "shape": "triangle", "size": 30, "title": "\u003cb\u003eDate\u003c/b\u003e\u003cbr\u003e1955"}, {"color": "#85B7EB", "font": {"color": "white"}, "id": "iPhone", "label": "iPhone", "shape": "dot", "size": 30, "title": "\u003cb\u003eProduct\u003c/b\u003e\u003cbr\u003eiPhone"}, {"color": "#AFA9EC", "font": {"color": "white"}, "id": "Tim Cook", "label": "Tim Cook", "shape": "ellipse", "size": 30, "title": "\u003cb\u003ePerson\u003c/b\u003e\u003cbr\u003eTim Cook"}]);
                  edges = new vis.DataSet([{"arrows": "to", "from": "Steve Jobs", "label": "FOUNDED", "title": "FOUNDED", "to": "Apple Inc."}, {"arrows": "to", "from": "Apple Inc.", "label": "LOCATED IN", "title": "LOCATED_IN", "to": "California"}, {"arrows": "to", "from": "Steve Jobs", "label": "BORN IN", "title": "BORN_IN", "to": "1955"}, {"arrows": "to", "from": "Steve Jobs", "label": "CREATED", "title": "CREATED", "to": "iPhone"}, {"arrows": "to", "from": "Tim Cook", "label": "LEADS", "title": "LEADS", "to": "Apple Inc."}, {"arrows": "to", "from": "Apple Inc.", "label": "PRODUCES", "title": "PRODUCES", "to": "iPhone"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": true, "forceAtlas2Based": {"springLength": 130, "springConstant": 0.04, "damping": 0.9}, "solver": "forceAtlas2Based", "stabilization": {"enabled": true, "iterations": 150}}, "nodes": {"size": 28, "font": {"size": 13, "strokeWidth": 2, "strokeColor": "#000000"}, "borderWidth": 2, "borderWidthSelected": 4}, "edges": {"font": {"size": 10, "align": "middle"}, "color": {"color": "#444466", "highlight": "#ffffff"}, "arrows": {"to": {"enabled": true, "scaleFactor": 0.7}}, "smooth": {"type": "dynamic"}}, "interaction": {"hover": true, "tooltipDelay": 100, "zoomView": true, "dragView": true}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
